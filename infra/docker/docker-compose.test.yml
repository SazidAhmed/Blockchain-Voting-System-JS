services:
  mysql:
    image: mysql:8.0
    container_name: voting-test-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voting_test_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voting_test_db}
      MYSQL_USER: ${MYSQL_USER:-voting_test_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voting_test_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ../../services/backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-voting_test_root_pass}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: voting-test-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-voting_test_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-voting_test_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voting_test_root_pass}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-test-network

  blockchain-node:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-test-blockchain
    restart: always
    environment:
      NODE_ID: node1
      PORT: 3010
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://voting-test-blockchain-2:3011,http://voting-test-blockchain-3:3012,http://voting-test-blockchain-4:3013
    ports:
      - "3010:3010"
    volumes:
      - blockchain_test_data:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3010/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  blockchain-node-2:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-test-blockchain-2
    restart: always
    environment:
      NODE_ID: blockchain-node-2
      PORT: 3011
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://voting-test-blockchain:3010,http://voting-test-blockchain-3:3012,http://voting-test-blockchain-4:3013
    ports:
      - "3011:3011"
    volumes:
      - blockchain_test_data_2:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3011/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  blockchain-node-3:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-test-blockchain-3
    restart: always
    environment:
      NODE_ID: blockchain-node-3
      PORT: 3012
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://voting-test-blockchain:3010,http://voting-test-blockchain-2:3011,http://voting-test-blockchain-4:3013
    ports:
      - "3012:3012"
    volumes:
      - blockchain_test_data_3:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3012/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  blockchain-node-4:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-test-blockchain-4
    restart: always
    environment:
      NODE_ID: blockchain-node-4
      PORT: 3013
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://voting-test-blockchain:3010,http://voting-test-blockchain-2:3011,http://voting-test-blockchain-3:3012
    ports:
      - "3013:3013"
    volumes:
      - blockchain_test_data_4:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3013/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: voting-test-backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-voting_test_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-voting_test_pass}
      DB_NAME: ${MYSQL_DATABASE:-voting_test_db}
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-for-integration-tests}
      BLOCKCHAIN_NODE_URL: http://voting-test-blockchain:3010
      FRONTEND_URL: http://localhost:5175
      INSTITUTION_API_URL: http://voting-test-institution-api:4005
    ports:
      - "3005:3005"
    volumes:
      - ../../services/backend:/app
      - /app/node_modules
      - ../../services/backend/keys:/app/keys
    depends_on:
      mysql:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
      institution-api:
        condition: service_healthy
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3005/api/elections",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: sh -c "npm run migrate && npm start"

  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
    container_name: voting-test-frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3005/api}
      VITE_BLOCKCHAIN_URL: ${VITE_BLOCKCHAIN_URL:-http://localhost:3010}
      VITE_INSTITUTION_API_URL: ${VITE_INSTITUTION_API_URL:-http://localhost:4005}
    ports:
      - "5175:5175"
    volumes:
      - ../../services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - voting-test-network
    command: npm run dev -- --host 0.0.0.0

  admin-panel:
    build:
      context: ../../services/admin-panel
      dockerfile: Dockerfile
    container_name: voting-test-admin-panel
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3005/api}
    ports:
      - "5176:5176"
    volumes:
      - ../../services/admin-panel:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - voting-test-network
    command: npm run dev -- --host 0.0.0.0 --port 5176

  institution-api:
    build:
      context: ../../services/institution-api
      dockerfile: Dockerfile
    container_name: voting-test-institution-api
    restart: always
    environment:
      PORT: 4005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-voting_test_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-voting_test_pass}
      DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voting_test_root_pass}
      DB_NAME: institution_test_db
    ports:
      - "4005:4005"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-test-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4005/api/health",
        ]
      timeout: 10s
      retries: 5
      start_period: 20s
      interval: 15s

networks:
  voting-test-network:
    driver: bridge

volumes:
  mysql_test_data:
    driver: local
  blockchain_test_data:
    driver: local
  blockchain_test_data_2:
    driver: local
  blockchain_test_data_3:
    driver: local
  blockchain_test_data_4:
    driver: local
