# Usage: docker-compose -f infra/docker/docker-compose.prod.yml --env-file .env up -d
# Production stack: MySQL, blockchain, backend, frontend (nginx), institution-api, nginx reverse proxy

services:
  # ── Data Layer ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.36
    container_name: voting-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../services/backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Backend Services ─────────────────────────────────────────────────────────
  blockchain-node:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-prod
    restart: always
    environment:
      NODE_ID: node1
      PORT: ${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required}
      NODE_ENV: production
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - blockchain_data:/app/data
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE1_PORT}/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  institution-api:
    build:
      context: ../../services/institution-api
      dockerfile: Dockerfile
    container_name: voting-institution-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${INSTITUTION_PORT:?INSTITUTION_PORT is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: ${INSTITUTION_DB_NAME:?INSTITUTION_DB_NAME is required}
      INSTITUTION_API_KEY: ${INSTITUTION_API_KEY:?INSTITUTION_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:?ADMIN_PANEL_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${INSTITUTION_PORT}/api/health",
        ]
      timeout: 10s
      retries: 5
      start_period: 20s
      interval: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: voting-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BLOCKCHAIN_NODE_URL: ${BLOCKCHAIN_NODE_URL:?BLOCKCHAIN_NODE_URL is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      INSTITUTION_API_URL: ${INSTITUTION_API_URL:?INSTITUTION_API_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - ../../services/backend/keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BACKEND_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: sh -c "npm run migrate && node index.js"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_BLOCKCHAIN_URL: ${VITE_BLOCKCHAIN_URL:?VITE_BLOCKCHAIN_URL is required}
    container_name: voting-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voting-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Reverse Proxy ────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: voting-nginx
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - voting-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      timeout: 5s
      retries: 3
      interval: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  voting-network:
    driver: bridge

volumes:
  mysql_data:
  blockchain_data:
