# Usage: docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.multi-node.yml up -d
# Override for 5 blockchain nodes (3 validators + 2 observers). Requires .env.

services:
  # ── Data Layer ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.36
    container_name: voting-mysql-multinode
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    command: >
      --innodb_buffer_pool_size=1G
      --innodb_redo_log_capacity=512M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data_multinode:/var/lib/mysql
      - ../../services/backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - backend-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  # ── Validator Nodes ──────────────────────────────────────────────────────────
  blockchain-node-1:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      NODE_ID: node1
      NODE_TYPE: validator
      PORT: ${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required}
      PEERS: http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required},http://blockchain-node-5:${BLOCKCHAIN_NODE5_PORT:?BLOCKCHAIN_NODE5_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
    ports:
      - "127.0.0.1:${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required}:${BLOCKCHAIN_NODE1_PORT}"
    volumes:
      - blockchain_data_node1:/app/data
    networks:
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE1_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  blockchain-node-2:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      NODE_ID: node2
      NODE_TYPE: validator
      PORT: ${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required}
      PEERS: http://blockchain-node-1:${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required},http://blockchain-node-5:${BLOCKCHAIN_NODE5_PORT:?BLOCKCHAIN_NODE5_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
    volumes:
      - blockchain_data_node2:/app/data
    ports:
      - "127.0.0.1:${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required}:${BLOCKCHAIN_NODE2_PORT}"
    networks:
      - backend-net
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE2_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  blockchain-node-3:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      NODE_ID: node3
      NODE_TYPE: validator
      PORT: ${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required}
      PEERS: http://blockchain-node-1:${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required},http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required},http://blockchain-node-5:${BLOCKCHAIN_NODE5_PORT:?BLOCKCHAIN_NODE5_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
    volumes:
      - blockchain_data_node3:/app/data
    ports:
      - "127.0.0.1:${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required}:${BLOCKCHAIN_NODE3_PORT}"
    networks:
      - backend-net
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE3_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ── Observer Nodes ───────────────────────────────────────────────────────────
  blockchain-node-4:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      NODE_ID: node4
      NODE_TYPE: observer
      PORT: ${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required}
      PEERS: http://blockchain-node-1:${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required},http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required},http://blockchain-node-5:${BLOCKCHAIN_NODE5_PORT:?BLOCKCHAIN_NODE5_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
    volumes:
      - blockchain_data_node4:/app/data
    ports:
      - "127.0.0.1:${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required}:${BLOCKCHAIN_NODE4_PORT}"
    networks:
      - backend-net
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE4_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  blockchain-node-5:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      NODE_ID: node5
      NODE_TYPE: observer
      PORT: ${BLOCKCHAIN_NODE5_PORT:?BLOCKCHAIN_NODE5_PORT is required}
      PEERS: http://blockchain-node-1:${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required},http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
    volumes:
      - blockchain_data_node5:/app/data
    ports:
      - "127.0.0.1:${BLOCKCHAIN_NODE5_PORT:?BLOCKCHAIN_NODE5_PORT is required}:${BLOCKCHAIN_NODE5_PORT}"
    networks:
      - backend-net
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE5_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  backend-net:
    driver: bridge

volumes:
  mysql_data_multinode:
  blockchain_data_node1:
  blockchain_data_node2:
  blockchain_data_node3:
  blockchain_data_node4:
  blockchain_data_node5:
