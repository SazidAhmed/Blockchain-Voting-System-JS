services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: voting-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voting_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voting_db}
      MYSQL_USER: ${MYSQL_USER:-voting_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voting_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../services/backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-voting_root_pass}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: voting-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-voting_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-voting_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voting_root_pass}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network

  # Blockchain Node
  blockchain-node:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain
    restart: always
    environment:
      NODE_ID: node1
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://blockchain-node-2:3002,http://blockchain-node-3:3003,http://blockchain-node-4:3004
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:-dev-blockchain-key-change-in-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "3001:3001"
    volumes:
      - blockchain_data:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3001/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Blockchain Node 2
  blockchain-node-2:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-2
    restart: always
    environment:
      NODE_ID: blockchain-node-2
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://blockchain-node:3001,http://blockchain-node-3:3003,http://blockchain-node-4:3004
    ports:
      - "3002:3002"
    volumes:
      - blockchain_data_2:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3002/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Blockchain Node 3
  blockchain-node-3:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-3
    restart: always
    environment:
      NODE_ID: blockchain-node-3
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://blockchain-node:3001,http://blockchain-node-2:3002,http://blockchain-node-4:3004
    ports:
      - "3003:3003"
    volumes:
      - blockchain_data_3:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3003/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Blockchain Node 4
  blockchain-node-4:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-4
    restart: always
    environment:
      NODE_ID: blockchain-node-4
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
      PEERS: http://blockchain-node:3001,http://blockchain-node-2:3002,http://blockchain-node-3:3003
    ports:
      - "3004:3004"
    volumes:
      - blockchain_data_4:/app/data
      - ../../services/blockchain-node:/app
      - /app/node_modules
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3004/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Backend API
  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: voting-backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-voting_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-voting_pass}
      DB_NAME: ${MYSQL_DATABASE:-voting_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      BLOCKCHAIN_NODE_URL: http://blockchain-node:3001
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:-dev-blockchain-key-change-in-prod}
      INSTITUTION_API_KEY: ${INSTITUTION_API_KEY:-}
      FRONTEND_URL: http://localhost:5173
      INSTITUTION_API_URL: http://institution-api:4000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    env_file: ../../.env
    ports:
      - "3000:3000"
    volumes:
      - ../../services/backend:/app
      - /app/node_modules
      - ../../services/backend/keys:/app/keys
    depends_on:
      mysql:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
      institution-api:
        condition: service_healthy
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: sh -c "npm run migrate && npm start"

  # Frontend
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
    container_name: voting-frontend
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_BLOCKCHAIN_URL: ${VITE_BLOCKCHAIN_URL:-http://localhost:3001}
      VITE_INSTITUTION_API_URL: ${VITE_INSTITUTION_API_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    volumes:
      - ../../services/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - voting-network
    command: npm run dev -- --host 0.0.0.0

  # Admin Panel (Separate Vue App)
  admin-panel:
    build:
      context: ../../services/admin-panel
      dockerfile: Dockerfile
    container_name: voting-admin-panel
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_BLOCKCHAIN_URL: ${VITE_BLOCKCHAIN_URL:-http://localhost:3001}
    ports:
      - "5174:5174"
    volumes:
      - ../../services/admin-panel:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - voting-network
    command: npm run dev -- --host 0.0.0.0 --port 5174

  # Mock Institutional Directory API
  institution-api:
    build:
      context: ../../services/institution-api
      dockerfile: Dockerfile
    container_name: voting-institution-api
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-voting_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-voting_pass}
      DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-voting_root_pass}
      DB_NAME: institution_db
      NODE_ENV: ${NODE_ENV:-development}
      INSTITUTION_API_KEY: ${INSTITUTION_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/api/health",
        ]
      timeout: 10s
      retries: 5
      start_period: 20s
      interval: 15s

networks:
  voting-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  blockchain_data:
    driver: local
  blockchain_data_2:
    driver: local
  blockchain_data_3:
    driver: local
  blockchain_data_4:
    driver: local
