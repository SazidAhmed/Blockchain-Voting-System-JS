# Usage: docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
# Dev stack: MySQL, blockchain (4 nodes), backend, frontend, admin-panel, institution-api, phpMyAdmin

services:
  # ── Data Layer ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: voting-mysql
    restart: unless-stopped
    command: >
      --innodb_buffer_pool_size=1G
      --innodb_redo_log_capacity=512M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../services/backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  # ── Backend Services ─────────────────────────────────────────────────────────
  institution-api:
    build:
      context: ../../services/institution-api
      dockerfile: Dockerfile
    container_name: voting-institution-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PORT: ${INSTITUTION_PORT:?INSTITUTION_PORT is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: ${INSTITUTION_DB_NAME:?INSTITUTION_DB_NAME is required}
      INSTITUTION_API_KEY: ${INSTITUTION_API_KEY:?INSTITUTION_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:?ADMIN_PANEL_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    ports:
      - "127.0.0.1:${INSTITUTION_PORT}:${INSTITUTION_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${INSTITUTION_PORT}/api/health",
        ]
      timeout: 10s
      retries: 5
      start_period: 20s
      interval: 15s

  # Blockchain Node 1 (primary)
  blockchain-node:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain
    restart: unless-stopped
    environment:
      NODE_ID: node1
      PORT: ${BLOCKCHAIN_NODE1_PORT:?BLOCKCHAIN_NODE1_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PEERS: http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    ports:
      - "127.0.0.1:${BLOCKCHAIN_NODE1_PORT}:${BLOCKCHAIN_NODE1_PORT}"
    volumes:
      - blockchain_data:/app/data
    networks:
      - voting-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE1_PORT}/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Blockchain Node 2
  blockchain-node-2:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-2
    restart: unless-stopped
    environment:
      NODE_ID: blockchain-node-2
      PORT: ${BLOCKCHAIN_NODE2_PORT:?BLOCKCHAIN_NODE2_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PEERS: http://blockchain-node:${BLOCKCHAIN_NODE1_PORT},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - blockchain_data_2:/app/data
    networks:
      - voting-network
    depends_on:
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE2_PORT}/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Blockchain Node 3
  blockchain-node-3:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-3
    restart: unless-stopped
    environment:
      NODE_ID: blockchain-node-3
      PORT: ${BLOCKCHAIN_NODE3_PORT:?BLOCKCHAIN_NODE3_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PEERS: http://blockchain-node:${BLOCKCHAIN_NODE1_PORT},http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT},http://blockchain-node-4:${BLOCKCHAIN_NODE4_PORT}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - blockchain_data_3:/app/data
    networks:
      - voting-network
    depends_on:
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE3_PORT}/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Blockchain Node 4
  blockchain-node-4:
    build:
      context: ../../services/blockchain-node
      dockerfile: Dockerfile
    container_name: voting-blockchain-node-4
    restart: unless-stopped
    environment:
      NODE_ID: blockchain-node-4
      PORT: ${BLOCKCHAIN_NODE4_PORT:?BLOCKCHAIN_NODE4_PORT is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PEERS: http://blockchain-node:${BLOCKCHAIN_NODE1_PORT},http://blockchain-node-2:${BLOCKCHAIN_NODE2_PORT},http://blockchain-node-3:${BLOCKCHAIN_NODE3_PORT}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    volumes:
      - blockchain_data_4:/app/data
    networks:
      - voting-network
    depends_on:
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BLOCKCHAIN_NODE4_PORT}/node",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: npm start

  # Backend API
  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: voting-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:?DB_PORT is required}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BLOCKCHAIN_NODE_URL: ${BLOCKCHAIN_NODE_URL:?BLOCKCHAIN_NODE_URL is required}
      BLOCKCHAIN_API_KEY: ${BLOCKCHAIN_API_KEY:?BLOCKCHAIN_API_KEY is required}
      INSTITUTION_API_KEY: ${INSTITUTION_API_KEY:?INSTITUTION_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:?ADMIN_PANEL_URL is required}
      INSTITUTION_API_URL: ${INSTITUTION_API_URL:?INSTITUTION_API_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    env_file: ../../.env
    volumes:
      - ../../services/backend/keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
      institution-api:
        condition: service_healthy
    networks:
      - voting-network
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BACKEND_PORT}/health",
        ]
      timeout: 10s
      retries: 5
      interval: 15s
    command: sh -c "npm run migrate && npm start"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend Services ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
    container_name: voting-frontend
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
      VITE_BLOCKCHAIN_URL: ${VITE_BLOCKCHAIN_URL:?VITE_BLOCKCHAIN_URL is required}
      VITE_INSTITUTION_API_URL: ${VITE_INSTITUTION_API_URL:?VITE_INSTITUTION_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voting-network
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT is required}:${FRONTEND_PORT}"

  # Admin Panel (Separate Vue App)
  admin-panel:
    build:
      context: ../../services/admin-panel
      dockerfile: Dockerfile
    container_name: voting-admin-panel
    restart: unless-stopped
    environment:
      PORT: ${ADMIN_PANEL_PORT:?ADMIN_PANEL_PORT is required}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
      VITE_BLOCKCHAIN_URL: ${VITE_BLOCKCHAIN_URL:?VITE_BLOCKCHAIN_URL is required}
      VITE_INSTITUTION_API_URL: ${VITE_INSTITUTION_API_URL:?VITE_INSTITUTION_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voting-network
    ports:
      - "127.0.0.1:${ADMIN_PANEL_PORT:?ADMIN_PANEL_PORT is required}:${ADMIN_PANEL_PORT}"

  # ── Auxiliary ────────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: voting-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${DB_HOST:?DB_HOST is required}
      PMA_PORT: ${DB_PORT:?DB_PORT is required}
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network
    ports:
      - "127.0.0.1:${PMA_HOST_PORT:?PMA_HOST_PORT is required}:80"

networks:
  voting-network:
    driver: bridge

volumes:
  mysql_data:
  blockchain_data:
  blockchain_data_2:
  blockchain_data_3:
  blockchain_data_4:
