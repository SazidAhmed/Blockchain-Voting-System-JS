# Usage: docker-compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.monitoring.yml up -d
# Monitoring stack: Prometheus, Grafana, cAdvisor, Node Exporter, MySQL Exporter, Loki, Promtail.
# Requires main stack running first (attaches to voting-network).

services:
  # ── Observability ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: voting-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      cadvisor:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
    networks:
      - voting-network
      - monitoring
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:?PROMETHEUS_PORT is required}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: voting-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?GRAFANA_PORT is required}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Infrastructure Metrics ───────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: voting-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring
    ports:
      - "127.0.0.1:${CADVISOR_PORT:?CADVISOR_PORT is required}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      timeout: 10s
      retries: 3
      interval: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: voting-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:?NODE_EXPORTER_PORT is required}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      timeout: 10s
      retries: 3
      interval: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: voting-mysql-exporter
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - voting-network
      - monitoring
    environment:
      DATA_SOURCE_NAME: ${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@(${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required})/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
    command:
      - "--collect.global_status"
      - "--collect.info_schema.innodb_stats"
      - "--collect.info_schema.innodb_trx"
      - "--collect.info_schema.innodb_cmp"
      - "--collect.info_schema.innodb_cmpmem"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Log Aggregation ──────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.6
    container_name: voting-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring
    ports:
      - "127.0.0.1:${LOKI_PORT:?LOKI_PORT is required}:3100"
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:2.9.6
    container_name: voting-promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitoring
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  voting-network:
    driver: bridge
    external: true
  monitoring:
    driver: bridge
    name: voting-monitoring

volumes:
  prometheus_data:
    name: voting_prometheus_data
  grafana_data:
    name: voting_grafana_data
  loki_data:
    name: voting_loki_data
