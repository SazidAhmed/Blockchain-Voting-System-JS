name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
    - name: Label PR by changed paths
      uses: actions/labeler@v5
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml
        sync-labels: true

  pr-validation:
    runs-on: ubuntu-latest
    needs: auto-label
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check PR title format
      run: |
        TITLE="${{ github.event.pull_request.title }}"
        PATTERN='^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\(.+\))?: .{1,72}$'
        if [[ ! "$TITLE" =~ $PATTERN ]]; then
          echo "::error::PR title must follow Conventional Commits format."
          echo "Expected: type(scope): description"
          echo "Types: feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert"
          echo "Example: feat(voting): add ballot encryption"
          exit 1
        fi
        echo "PR title is valid: $TITLE"

    - name: Check PR description
      run: |
        BODY=$(cat <<'HEREDOC'
        ${{ github.event.pull_request.body }}
        HEREDOC
        )
        if [[ ${#BODY} -lt 20 ]]; then
          echo "::error::PR description too short. Describe your changes."
          exit 1
        fi
        echo "PR description looks good (${#BODY} chars)"

    - name: Enforce linked issue
      run: |
        BODY="${{ github.event.pull_request.body }}"
        if ! echo "$BODY" | grep -qE 'Closes? #|Fixes? #|Resolves? #'; then
          echo "::warning::PR should reference an issue (e.g., 'Closes #123')."
        fi

  pr-comment:
    runs-on: ubuntu-latest
    needs: pr-validation
    permissions:
      pull-requests: write
    steps:
    - name: Comment summary on PR
      uses: actions/github-script@v7
      with:
        script: |
          const checks = [
            { name: 'PR Title', status: '✅' },
            { name: 'PR Description', status: '✅' },
            { name: 'Docker Build', status: '✅' },
            { name: 'Security Scan', status: '✅' },
          ];
          const body = [
            '## 🔍 CI Summary',
            '',
            '| Check | Status |',
            '|-------|--------|',
            ...checks.map(c => `| ${c.name} | ${c.status} |`),
            '',
            `> PR by @${{ github.event.pull_request.user.login }}`,
            `> Target: **${{ github.event.pull_request.base.ref }}**`,
          ].join('\n');

          // Find existing bot comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c =>
            c.user.type === 'Bot' && c.body.includes('CI Summary')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
