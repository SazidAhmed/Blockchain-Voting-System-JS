name: Documentation
description: Suggest documentation changes or additions
labels: ["documentation"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - README
        - API docs
        - Code comments
        - Deployment guide
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What needs to change?
      description: Describe the documentation update.
    validations:
      required: true
