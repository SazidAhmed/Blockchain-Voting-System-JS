name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Feature requests are welcome.** Describe the problem you want solved.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Is it related to a frustration?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend (Vue 3)
        - Admin Panel
        - Backend (Express)
        - Blockchain Node
        - Institution API
        - Docker / Infrastructure
        - Cross-cutting (multiple services)
    validations:
      required: true
